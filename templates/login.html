{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
    <h1>Вход в систему</h1>
    <form method="POST">
        <div class="field">
            <label>Логин или Email:</label>
            <input type="text" name="login" value="{{ login }}" required>
        </div>
        <div class="field">
            <label>Пароль:</label>
            <input type="password" name="password" required>
        </div>
        <div class="field">
            <label>Капча: {{ session.get('captcha_question', '') }}</label>
            <input type="text" name="captcha" placeholder="Введите ответ" required>
            {% if errors and errors.captcha %}
                <span class="error">{{ errors.captcha }}</span>
            {% endif %}
        </div>
        <div>
            <input type="submit" value="Войти">
        </div>
    </form>
    <p>Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></p>
{% endblock %}
